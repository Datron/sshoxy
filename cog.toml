#:schema https://docs.cocogitto.io/cog-schema.json

branch_whitelist = ["master"]
tag_prefix = "v"
ignore_merge_commits = true

pre_bump_hooks = [
    "cargo clippy --workspace --all-targets",
    "cargo fmt --all -- --check",
    "cargo set-version --workspace {{version}}",
]

post_bump_hooks = [
    "git push",
    "git push origin --tags",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "Datron"
repository = "sshoxy"

[commit_types]
feat = { bump_minor = true }
fix = { bump_patch = true }
refactor = { bump_patch = true }
